<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Mis horas</title>
<style>
  :root {
    --bg: #eef2f8; --panel: #ffffff; --ink: #16202f; --mute: #66728a; --line: #dde4ef;
    --blue: #2563eb; --amber: #e39200; --night: #6a4df4;
    font-family: ui-rounded, "Segoe UI Variable", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1420; --panel: #172030; --ink: #e8edf6; --mute: #8e9ab0; --line: #26324a;
            --blue: #6d93ff; --amber: #ffb62e; --night: #a99bff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         padding: 0 14px calc(40px + env(safe-area-inset-bottom)); max-width: 520px; margin-inline: auto; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Cabecera */
  .bar { display: flex; align-items: center; gap: 6px; padding: calc(14px + env(safe-area-inset-top)) 0 10px; }
  .bar h1 { flex: 1; margin: 0; font-size: 1.35rem; font-weight: 700; text-align: center; }
  h1::first-letter { text-transform: uppercase; }
  .ico { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--panel); font-size: 1.3rem; line-height: 1; }

  /* Resumen */
  .resumen { background: var(--panel); border-radius: 22px; padding: 18px; }
  .hero { display: flex; align-items: center; gap: 16px; }
  .anillo { position: relative; width: 138px; height: 138px; flex: none; }
  .anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anillo circle { fill: none; stroke-width: 11; stroke-linecap: round; }
  .anillo .fondo { stroke: var(--line); }
  .anillo .azul { stroke: var(--blue); }
  .anillo .ambar { stroke: var(--amber); }
  @media (prefers-reduced-motion: no-preference) { .anillo circle { transition: stroke-dashoffset .5s ease; } }
  .centro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .centro b { font-size: 2rem; line-height: 1; }
  .centro span { font-size: .78rem; color: var(--mute); margin-top: 4px; }
  .datos { flex: 1; margin: 0; display: grid; gap: 10px; }
  .datos div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .88rem; }
  .datos dt { color: var(--mute); }
  .datos dd { margin: 0; font-weight: 600; text-align: right; }
  .datos small, .real small { font-weight: 400; color: var(--mute); font-size: .72rem; }
  .ambar-t { color: var(--amber); }
  .dinero { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .dinero div + div { border-left: 1px solid var(--line); padding-left: 16px; }
  .dinero span { font-size: .78rem; color: var(--mute); }
  .dinero b { display: block; font-size: 1.45rem; margin-top: 2px; }

  /* Días */
  #dias { margin-top: 14px; display: grid; gap: 6px; }
  .dia { background: var(--panel); border-radius: 14px; border-left: 4px solid transparent; }
  .dia.hoy { border-left-color: var(--blue); }
  .dia summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; }
  .dia summary::-webkit-details-marker { display: none; }
  .num { font-size: 1.25rem; font-weight: 700; width: 30px; }
  .sem { width: 34px; font-size: .85rem; color: var(--mute); }
  .we .num, .we .sem { color: var(--night); }
  .prev { flex: 1; font-size: .82rem; color: var(--mute); }
  .real { font-weight: 700; }
  .luna { width: 20px; text-align: center; }
  .edit { padding: 2px 14px 14px; display: grid; gap: 8px; }
  .fila { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; align-items: center; font-size: .85rem; color: var(--mute); }
  .edit input { width: 100%; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  .copiar { border: 0; border-radius: 10px; background: var(--blue); color: #fff; padding: 10px; font-weight: 600; }

  /* Ajustes */
  dialog { border: 0; border-radius: 22px; padding: 20px; width: min(92vw, 420px); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: #0008; }
  dialog h2 { margin: 0 0 4px; font-size: 1.2rem; }
  dialog p { margin: 0 0 14px; font-size: .82rem; color: var(--mute); }
  .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .campos label { display: grid; gap: 4px; font-size: .78rem; color: var(--mute); }
  .campos input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  #cerrar { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 700; }
</style>
</head>
<body>

<header class="bar">
  <button class="ico" id="prev" aria-label="Mes anterior">‹</button>
  <h1 id="titulo"></h1>
  <button class="ico" id="next" aria-label="Mes siguiente">›</button>
  <button class="ico" id="abrir" aria-label="Ajustes y precios">⚙</button>
</header>

<section class="resumen">
  <div class="hero">
    <div class="anillo">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="fondo" cx="60" cy="60" r="54"/>
        <circle class="azul" id="rb" cx="60" cy="60" r="54"/>
        <circle class="ambar" id="ra" cx="60" cy="60" r="54"/>
      </svg>
      <div class="centro"><b id="rReal">0</b><span id="rDe"></span></div>
    </div>
    <dl class="datos">
      <div><dt>Previstas</dt><dd id="vPrev"></dd></div>
      <div><dt id="lblX">Te faltan</dt><dd id="vX"></dd></div>
      <div><dt>Noche</dt><dd id="vNoche"></dd></div>
      <div><dt>Pluses</dt><dd id="vPluses"></dd></div>
    </dl>
  </div>
  <div class="dinero">
    <div><span>Bruto estimado</span><b id="vBruto"></b></div>
    <div><span>Neto estimado</span><b id="vNeto"></b></div>
  </div>
</section>

<main id="dias"></main>

<dialog id="aj">
  <h2>Ajustes y precios</h2>
  <p>Se guardan solo en este móvil.</p>
  <div class="campos">
    <label>Horas contrato/mes <input type="number" id="contrato" step="0.5" inputmode="decimal"></label>
    <label>Fijo mensual (€) <input type="number" id="fijo" step="0.01" inputmode="decimal"></label>
    <label>€/h complementaria <input type="number" id="pComp" step="0.001" inputmode="decimal"></label>
    <label>% deducciones <input type="number" id="ded" step="0.01" inputmode="decimal"></label>
    <label>€/h noche 22–00 <input type="number" id="pN1" step="0.001" inputmode="decimal"></label>
    <label>€/h noche 00–06 <input type="number" id="pN2" step="0.001" inputmode="decimal"></label>
  </div>
  <button id="cerrar">Listo</button>
</dialog>

<script>
const $ = id => document.getElementById(id);
const KEY = 'horas-v1'; // misma clave: no pierdes lo apuntado
const hoy = new Date();
const pad = n => String(n).padStart(2, '0');
const def = { contrato: 47, fijo: 423.21, pComp: 9.011, pN1: 0.32, pN2: 1.279, ded: 6.5,
              mes: hoy.getFullYear() + '-' + pad(hoy.getMonth() + 1), dias: {} };
let S = Object.assign({}, def, JSON.parse(localStorage.getItem(KEY) || '{}'));
const guardar = () => localStorage.setItem(KEY, JSON.stringify(S));

const aMin = t => t ? (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)) : null;
const tramo = (a, b) => (a == null || b == null) ? null : ((b - a) + 1440) % 1440;
const fmt = m => Math.floor(m / 60) + 'h ' + pad(Math.round(m % 60)) + 'm';
const dec = m => (Math.round(m / 60 * 100) / 100).toFixed(2).replace('.', ',');
const r2 = x => Math.round(x * 100) / 100;
const eur = x => x.toFixed(2).replace('.', ',') + ' €';
const con = m => `${fmt(m)} <small>${dec(m)} h</small>`;
const C = 2 * Math.PI * 54; // longitud del anillo

// Minutos nocturnos: [22:00–00:00, 00:00–06:00]
function nocturnos(ini, dur) {
  let a = 0, b = 0;
  if (ini == null || !dur) return [0, 0];
  for (let i = 0; i < dur; i++) {
    const m = (ini + i) % 1440;
    if (m >= 1320) a++; else if (m < 360) b++;
  }
  return [a, b];
}

function pintar() {
  const [y, m] = S.mes.split('-').map(Number);
  $('titulo').textContent = new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  const total = new Date(y, m, 0).getDate();
  const nom = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const hoyStr = `${hoy.getFullYear()}-${pad(hoy.getMonth() + 1)}-${pad(hoy.getDate())}`;
  let h = '';
  for (let d = 1; d <= total; d++) {
    const f = `${S.mes}-${pad(d)}`;
    const x = S.dias[f] || {};
    const wd = new Date(y, m - 1, d).getDay();
    const t = k => `<input type="time" data-f="${f}" data-k="${k}" value="${x[k] ?? ''}">`;
    const esHoy = f === hoyStr;
    h += `<details class="dia ${wd % 6 === 0 ? 'we' : ''} ${esHoy ? 'hoy' : ''}" id="d-${f}" ${esHoy ? 'open' : ''}>
      <summary><span class="num">${d}</span><span class="sem">${nom[wd]}</span>
        <span class="prev" id="pv-${f}"></span><span class="real" id="r-${f}"></span><span class="luna" id="n-${f}"></span></summary>
      <div class="edit">
        <div class="fila"><span>Previsto</span>${t('ps')}${t('pe')}</div>
        <div class="fila"><span>Real</span>${t('rs')}${t('re')}</div>
        <button class="copiar" data-copy="${f}">Copiar previsto a real</button>
      </div></details>`;
  }
  $('dias').innerHTML = h;
  calcular();
  if (S.mes === hoyStr.slice(0, 7)) $('d-' + hoyStr)?.scrollIntoView({ block: 'center' });
}

function calcular() {
  let prev = 0, real = 0, nA = 0, nB = 0;
  document.querySelectorAll('[id^="r-"]').forEach(el => {
    const f = el.id.slice(2), x = S.dias[f] || {};
    prev += tramo(aMin(x.ps), aMin(x.pe)) ?? 0;
    const rs = aMin(x.rs);
    const r = tramo(rs, aMin(x.re)) ?? 0;
    const [a, b] = nocturnos(rs, r);
    real += r; nA += a; nB += b;
    el.textContent = r ? fmt(r) : '';
    $('n-' + f).textContent = a + b ? '🌙' : '';
    $('pv-' + f).textContent = x.ps && x.pe ? `${x.ps}–${x.pe}` : '';
  });

  const cont = (+S.contrato || 0) * 60;
  const extra = Math.max(0, real - cont);
  const falta = Math.max(0, cont - real);

  // Como la nómina: horas a 2 decimales × precio
  const eComp = r2(r2(extra / 60) * (+S.pComp || 0));
  const eN1 = r2(r2(nA / 60) * (+S.pN1 || 0));
  const eN2 = r2(r2(nB / 60) * (+S.pN2 || 0));
  const pluses = eComp + eN1 + eN2;
  const bruto = (+S.fijo || 0) + pluses;
  const neto = bruto * (1 - (+S.ded || 0) / 100);

  $('rb').style.strokeDasharray = $('ra').style.strokeDasharray = C;
  $('rb').style.strokeDashoffset = C * (1 - (cont ? Math.min(real / cont, 1) : 0));
  $('ra').style.strokeDashoffset = C * (1 - (cont ? Math.min(extra / cont, 1) : 0));
  $('rReal').textContent = dec(real);
  $('rDe').textContent = `de ${S.contrato || 0} h`;

  $('vPrev').innerHTML = con(prev);
  $('lblX').textContent = extra ? 'Complementarias' : 'Te faltan';
  $('vX').innerHTML = con(extra || falta);
  $('vX').className = extra ? 'ambar-t' : '';
  $('vNoche').innerHTML = con(nA + nB);
  $('vPluses').textContent = eur(pluses);
  $('vBruto').textContent = eur(bruto);
  $('vNeto').textContent = eur(neto);
}

$('dias').addEventListener('input', e => {
  const { f, k } = e.target.dataset;
  if (!f) return;
  (S.dias[f] ||= {})[k] = e.target.value;
  guardar(); calcular();
});
$('dias').addEventListener('click', e => {
  const f = e.target.dataset.copy;
  if (!f) return;
  const x = (S.dias[f] ||= {});
  x.rs = x.ps || ''; x.re = x.pe || '';
  document.querySelector(`[data-f="${f}"][data-k="rs"]`).value = x.rs;
  document.querySelector(`[data-f="${f}"][data-k="re"]`).value = x.re;
  guardar(); calcular();
});

// Cambio de mes con las flechas
function mover(delta) {
  const [y, m] = S.mes.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  S.mes = d.getFullYear() + '-' + pad(d.getMonth() + 1);
  guardar(); pintar();
}
$('prev').onclick = () => mover(-1);
$('next').onclick = () => mover(1);

// Ajustes
['contrato', 'fijo', 'pComp', 'ded', 'pN1', 'pN2'].forEach(id => {
  $(id).value = S[id];
  $(id).addEventListener('input', () => { S[id] = $(id).value; guardar(); calcular(); });
});
$('abrir').onclick = () => $('aj').showModal();
$('cerrar').onclick = () => $('aj').close();

pintar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
